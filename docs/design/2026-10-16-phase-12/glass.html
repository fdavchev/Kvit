<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvit glass popups</title>
<style>
:root{--t:#2b1d10;--bg:#ffd9a8;--card:#fff1dc;--line:#9c6f47;--pri:#b54a00;--pritext:#fff;--glassbg:rgba(255,241,220,.62);--glassline:rgba(255,255,255,.7);--sheetsh:0 -8px 30px rgba(61,38,16,.25)}
.dark{--t:#fff1dc;--bg:#1f1816;--card:#2c2220;--line:#72625c;--pri:#d9b48a;--pritext:#1f1816;--glassbg:rgba(44,34,32,.58);--glassline:rgba(255,241,220,.28);--sheetsh:0 -8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{margin:0;padding:1.25rem;font:1rem system-ui,sans-serif;background:#111;color:#eee}
h1{font-size:1.25rem;margin:0 0 .6rem}.note{font-size:.85rem;color:#ccc;margin:.4rem 0 .8rem}
.bar button{padding:.55rem 1rem;border-radius:999px;border:1px solid #888;background:#222;color:#eee;font-size:.95rem;cursor:pointer;margin:0 .4rem .4rem 0}
.bar button.on{background:#d9b48a;color:#1f1816;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:1rem}
.phone{width:22.5rem;max-width:100%;height:38rem;position:relative;overflow:hidden;border-radius:1.2rem;background:var(--bg);color:var(--t);box-shadow:0 0 0 1px #444}
.bgart{position:absolute;inset:0;padding:1rem}
.c{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.8rem;margin-bottom:.6rem}
.dot{display:inline-block;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--pri);margin-right:.5rem;vertical-align:middle}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:1.1rem 1.1rem 1.4rem;border-radius:1.4rem 1.4rem 0 0;box-shadow:var(--sheetsh)}
.btn{display:block;width:100%;padding:.8rem;border-radius:999px;text-align:center;font-weight:700;margin-top:.7rem;border:0;font-size:1rem}
.pri{background:var(--pri);color:var(--pritext)}
.sec{background:transparent;color:var(--t);border:1.5px solid var(--line)}
.toast{position:absolute;left:1rem;right:1rem;bottom:1rem;padding:.8rem 1rem;border-radius:.9rem;display:flex;justify-content:space-between;font-weight:600}
.cbar{position:absolute;left:.7rem;right:.7rem;bottom:5.2rem;padding:.9rem;border-radius:1rem}
.gs{background:var(--glassbg);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid var(--glassline);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 20px rgba(0,0,0,.25)}
.so{background:var(--card);border:1px solid var(--line)}
.gl2{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line)}
.lab{font-size:.8rem;opacity:.8;margin-bottom:.3rem}
.tag{position:absolute;top:.5rem;right:.7rem;font-size:.75rem;background:#000a;color:#fff;padding:.15rem .5rem;border-radius:999px;z-index:3}
</style></head><body>
<h1>Glass look on popups: pick A, B or C</h1>
<div class="note">Each phone shows a sheet, the closing bar and a toast over a busy background so you can judge the blur. Switch light/dark. The text colour on every popup stays at 4.5:1 or better (measured when built).</div>
<div class="bar" id="th"><button data-m="">Light</button><button data-m="dark" class="on">Dark</button></div>
<div class="row" id="row"></div>
<script>
const variants={
A:{n:'A: full glass',d:'Strong blur, see-through, bright edge. Most striking; text safety needs a slightly more opaque tint.',cls:'gs'},
B:{n:'B: soft glass',d:'Light blur, mostly solid, thin line. Calm, easiest to read.',cls:'gl2'},
C:{n:'C: solid (today)',d:'No glass. Solid card colour with a line.',cls:'so'}
};
function phone(k){const v=variants[k];return `<div><div class="lab"><b>${v.n}</b><br>${v.d}</div><div class="phone" id="p${k}"><span class="tag">${k}</span>
<div class="bgart"><div class="c"><span class="dot"></span>Trip to Ohrid · You are owed 1 200 ден.</div><div class="c"><span class="dot"></span>Flat · You owe 800 ден.</div><div class="c"><span class="dot"></span>Dinner club · All even</div><div class="c"><span class="dot"></span>Ski week · You are owed 3 000 ден.</div><div class="c"><span class="dot"></span>Birthday · 2 people</div></div>
<div class="cbar ${v.cls}"><b>Marko wants to close the group</b><div style="display:flex;gap:.5rem"><span class="btn pri" style="margin-top:.5rem">Confirm</span><span class="btn sec" style="margin-top:.5rem">Object</span></div></div>
<div class="sheet ${v.cls}"><b>Add a name</b><div class="c" style="margin:.6rem 0 0">Grandma</div><span class="btn pri">Add</span><span class="btn sec">Close</span></div>
</div></div>`}
document.getElementById('row').innerHTML=Object.keys(variants).map(phone).join('');
document.querySelectorAll('#th button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.phone').forEach(p=>p.classList.toggle('dark',b.dataset.m==='dark'));document.querySelectorAll('#th button').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('.phone').forEach(p=>p.classList.add('dark'));
</script></body></html>
