<main class="screen screen-form $screen_class">
  <header class="screen-header">
    <h1 class="title">$title</h1>
  </header>
  <form class="form" novalidate>
    <div class="fields">
$fields
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="submit">$submit</button>
$extras
    </div>
  </form>
</main>
