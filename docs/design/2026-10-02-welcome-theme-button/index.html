<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kvit: light/dark button on Welcome (mockup)</title>
<link rel="stylesheet" href="../2026-10-01-round-3/source/palette.css">
<link rel="stylesheet" href="../2026-10-01-round-3/source/base.css">
<link rel="stylesheet" href="../2026-10-01-round-3/source/app.css">
<style>
  html, body { background: #e9e6e1; color: #222; }
  h2 { text-align: center; font-size: 1rem; margin: 24px 0 0; }
  .stage { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; padding: 16px 24px 24px; }
  .caption { text-align: center; font-size: 0.9rem; margin-bottom: 8px; color: #444; max-width: 360px; }
  .phone { width: 360px; height: 780px; overflow: hidden; border-radius: 28px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
    --bg: var(--orange-200); --ink: var(--orange-950); --ink-soft: var(--orange-900); --wordmark: var(--orange-deep);
    --primary: var(--orange-deep); --primary-hover: var(--orange-900); --primary-ink: var(--white);
    --secondary: var(--orange-50); --secondary-hover: var(--white); --secondary-ink: var(--orange-900);
    --link: var(--orange-900); --link-line: var(--orange-deep); --track: var(--orange-50); --track-active: var(--white);
    --track-shadow: var(--shadow); --ring: var(--orange-950);
    background: var(--bg); color: var(--ink); }
  .phone.dark {
    --bg: var(--dark-bg); --ink: var(--orange-50); --ink-soft: var(--orange-200); --wordmark: var(--dark-button);
    --primary: var(--dark-button); --primary-hover: var(--orange-50); --primary-ink: var(--dark-bg);
    --secondary: var(--dark-raised); --secondary-hover: var(--orange-900); --secondary-ink: var(--orange-50);
    --link: var(--orange); --link-line: var(--orange); --track: var(--dark-field); --track-active: var(--dark-raised);
    --track-shadow: transparent; --ring: var(--orange); }
  .phone .screen { min-height: 780px; }
  .top { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .top.split { justify-content: space-between; }
  .top .lang { align-self: auto; }
  .theme-btn { position: relative; flex: none; width: 44px; height: 44px; border: 0; border-radius: 999px; background: var(--track);
    color: var(--ink-soft); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: transform 100ms ease-out, background-color 150ms ease-out; }
  .theme-btn:active { transform: scale(0.94); }
  .theme-btn svg, .seg svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .theme-btn svg { position: absolute; inset: 0; margin: auto; width: 22px; height: 22px;
    transition: opacity 180ms ease-out, transform 180ms ease-out; }
  .theme-btn .moon { opacity: 1; transform: rotate(0) scale(1); }
  .theme-btn .sun { opacity: 0; transform: rotate(-60deg) scale(0.6); }
  .phone.dark .theme-btn .moon { opacity: 0; transform: rotate(60deg) scale(0.6); }
  .phone.dark .theme-btn .sun { opacity: 1; transform: rotate(0) scale(1); }
  .seg { display: flex; padding: 3px; border-radius: 999px; background: var(--track); }
  .seg button { display: grid; place-items: center; width: 44px; height: 38px; border: 0; border-radius: 999px; background: transparent;
    color: var(--ink-soft); cursor: pointer; touch-action: manipulation; transition: background-color 180ms ease-out, color 180ms ease-out; }
  .seg button[aria-pressed='true'] { background: var(--track-active); color: var(--ink); box-shadow: 0 1px 3px var(--track-shadow); }
  .seg svg { width: 20px; height: 20px; }
  @media (prefers-reduced-motion: reduce) { .theme-btn, .theme-btn svg, .seg button { transition: none; } }
  .hint { max-width: 760px; margin: 0 auto; padding: 0 24px 32px; text-align: center; font-size: 0.95rem; color: #333; }
</style>
</head>
<body>
<h2>Click any button to try it. The choice is remembered on that phone; "Same as device" stays in Settings.</h2>
<div class="stage" id="stage"></div>
<p class="hint">A is the one you liked. B shows both choices at once, like the language switch. C puts the button in the opposite corner, so the top row stays calm.</p>
<script>
  var MOON = '<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var SUN = '<svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var ROUND = '<button class="theme-btn" type="button" aria-label="Switch theme">' + MOON + SUN + '</button>';
  var LANG = '<div class="lang" role="group" aria-label="Language"><button class="lang-option" type="button" aria-pressed="true" lang="en">EN</button><button class="lang-option" type="button" aria-pressed="false" lang="mk">МК</button></div>';
  var SEG = '<div class="seg" role="group" aria-label="Theme"><button type="button" data-mode="light" aria-pressed="true" aria-label="Light">' + SUN + '</button><button type="button" data-mode="dark" aria-pressed="false" aria-label="Dark">' + MOON + '</button></div>';
  var VARIANTS = [
    { name: 'A: round button next to the language switch (your pick)', top: '<div class="top">' + ROUND + LANG + '</div>' },
    { name: 'B: two icons in a pill, like the language switch', top: '<div class="top">' + SEG + LANG + '</div>' },
    { name: 'C: round button in the opposite (left) corner', top: '<div class="top split">' + ROUND + LANG + '</div>' }
  ];
  function phone(variant, dark) {
    return '<div><p class="caption">' + variant.name + (dark ? ' (dark)' : ' (light)') + '</p><div class="phone' + (dark ? ' dark' : '') + '">' +
      '<main class="screen screen-welcome"><header class="hero">' + variant.top +
      '<div class="brand"><h1 class="wordmark">Kvit</h1><p class="tagline" lang="mk">Квит сме.</p><p class="tagline-translation">We’re even.</p></div></header>' +
      '<div class="welcome-body"><p class="pitch">Only you need an account. Friends can be just names.</p><div class="actions">' +
      '<button class="btn btn-primary btn-main" type="button">Continue with Google</button>' +
      '<a class="btn btn-secondary" href="#">Sign up with email</a><a class="btn btn-link" href="#">I already have an account</a>' +
      '</div></div></main></div></div>';
  }
  var stage = document.getElementById('stage');
  VARIANTS.forEach(function (variant) { stage.insertAdjacentHTML('beforeend', phone(variant, false)); });
  VARIANTS.forEach(function (variant) { stage.insertAdjacentHTML('beforeend', phone(variant, true)); });
  function sync(phoneEl) {
    var dark = phoneEl.classList.contains('dark');
    phoneEl.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', String((b.dataset.mode === 'dark') === dark)); });
    phoneEl.querySelectorAll('.theme-btn').forEach(function (b) { b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode'); });
  }
  document.querySelectorAll('.phone').forEach(sync);
  document.addEventListener('click', function (event) {
    var round = event.target.closest('.theme-btn');
    var seg = event.target.closest('.seg button');
    var phoneEl = event.target.closest('.phone');
    if (!phoneEl) { return; }
    if (round) { phoneEl.classList.toggle('dark'); sync(phoneEl); }
    if (seg) { phoneEl.classList.toggle('dark', seg.dataset.mode === 'dark'); sync(phoneEl); }
  });
</script>
</body>
</html>
