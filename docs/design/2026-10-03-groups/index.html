    shown.classList.add('out');
    setTimeout(function () { if (shown.parentNode) { shown.remove(); } }, TOAST_OUT_MS);
  }
  document.getElementById('hint').textContent = HINTS[s === 'signup' ? 'signup' : s === 'settings' ? 'settings' : s] || '';
  document.getElementById('states').innerHTML = s === 'join' ? JOIN_STATES.map(function (x) { return '<button data-js="' + x[0] + '" aria-pressed="' + (st.join === x[0]) + '">' + x[1] + '</button>'; }).join('') : (s === 'members' ? '<button data-act="hasexp" aria-pressed="' + st.hasExpenses + '">Phase 8 preview: I already have expenses (hides “That\'s me”)</button>' : '');
  document.querySelectorAll('#tabs button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.tab === s)); });
  document.querySelectorAll('.bar [data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === st.lang)); });
  document.querySelectorAll('.bar [data-theme]').forEach(function (b) { b.setAttribute('aria-pressed', String((b.dataset.theme === 'dark') === st.dark)); });
  document.querySelectorAll('.bar [data-nav]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.nav === st.nav)); });
  var nn = document.getElementById('newname'); if (nn && (st.addSheet || st.err)) { nn.focus(); }
  document.querySelectorAll('.bar [data-who]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.who === st.vname)); });
  document.documentElement.lang = st.lang;
}
function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function doAddName() {
  var g = st.g, nm = val('newname');
  st.addDraft = nm;
  if (!nm || nm.length > 60) { st.err = tr('nameBad'); }
  else if (g.members.filter(function (x) { return dn(x).toLowerCase() === nm.toLowerCase(); }).length) { st.err = tr('nameTaken', { n: nm }); }
  else { g.members.push({ id: 'n' + (uid++), name: nm }); st.err = null; st.addDraft = ''; st.addSheet = false; }
}
function go(to) { st.screen = to; st.sheet = null; st.addSheet = false; st.addDraft = ''; st.err = null; if (to === 'newgroup') { st.draft = { name: '', emoji: '🏖️', cur: 'MKD' }; } }
function undo(u) {
  var g = st.g;
  if (u === 'reset') { var t = g.link; g.link = g.prevLink; g.prevLink = t; }
  if (u === 'delete') { g.deleted = false; }
  if (u.indexOf('remove:') === 0) { var id = u.slice(7), m = g.removed.filter(function (x) { return x.id === id; })[0]; g.removed = g.removed.filter(function (x) { return x.id !== id; }); g.members.push(m); }
  st.toast = null;
}
document.getElementById('tabs').innerHTML = TABS.map(function (x) { return '<button data-tab="' + x[0] + '" aria-pressed="false">' + x[1] + '</button>'; }).join('');
document.addEventListener('click', function (e) {
  if (e.target.classList && e.target.classList.contains('scrim')) { st.sheet = null; st.addSheet = false; st.err = null; render(); return; }
  var el = e.target.closest('button'); if (!el) { return; }
  var a = el.dataset.act, g = st.g, id = el.dataset.id, m;
  if (a === 'eye') { var box = el.parentNode.querySelector('input'); box.type = box.type === 'password' ? 'text' : 'password'; return; }
  if (el.dataset.tab) { go(el.dataset.tab); if (el.dataset.tab === 'join') { st.join = 'new'; } }
  else if (el.dataset.js) { st.join = el.dataset.js; }
  else if (el.dataset.lang) { st.lang = el.dataset.lang; }
  else if (el.dataset.theme) { st.dark = el.dataset.theme === 'dark'; }
  else if (el.dataset.nav) { st.nav = el.dataset.nav; }
  else if (el.dataset.who) { st.vname = el.dataset.who; st.sheet = null; }
  else if (a === 'reset') { st = freshState(); }
  else if (a === 'goto') { go(el.dataset.to); }
  else if (a === 'toast') { toast(el.dataset.text); }
  else if (a === 'share') { toast('(The phone\'s share menu opens here)'); }
  else if (a === 'copy') { toast(tr('copied')); }
  else if (a === 'draftemoji') { st.draft.emoji = el.dataset.v; st.draft.name = val('gname'); }
  else if (a === 'draftcur') { st.draft.cur = el.dataset.v; st.draft.name = val('gname'); }
  else if (a === 'create') {
    var n = val('gname'); st.draft.name = n;
    if (!n || n.length > 60) { st.err = tr('nameBad'); }
    else { st.g = { name: n, emoji: st.draft.emoji, cur: st.draft.cur, deleted: false, link: 'Zt7' + (uid++) + 'pQe', prevLink: null, members: [{ id: 'f', name: 'Filip', acct: 1, owner: 1 }], removed: [], fresh: true }; st.vname = 'Filip'; st.left = false; go('group'); }
  }
  else if (a === 'addname') { doAddName(); }
  else if (a === 'addsheet') { st.addSheet = true; st.err = null; }
  else if (a === 'finopen') { st.finOpen = !st.finOpen; }
  else if (a === 'restorebd') { st.bdBack = true; toast(tr('restored'), null, true); }
  else if (a === 'resetlink') { g.prevLink = g.link; g.link = 'Rk' + (uid++) + 'x9Vb2Wq'; toast(tr('resetDone'), 'reset', true, true); }
  else if (a === 'sheet') { st.sheet = id; }
  else if (a === 'closesheet') { st.sheet = null; st.addSheet = false; st.err = null; }
  else if (a === 'makeowner') { m = find(id); g.members.forEach(function (x) { delete x.owner; }); m.owner = 1; st.sheet = null; toast(tr('ownerToast', { n: dn(m) })); }
  else if (a === 'remove') { m = find(id); g.members = g.members.filter(function (x) { return x.id !== id; }); g.removed.push(m); st.sheet = null; toast(tr('removedToast', { n: dn(m) }), 'remove:' + id, true, true); }
  else if (a === 'letback') { m = g.removed.filter(function (x) { return x.id === id; })[0]; g.removed = g.removed.filter(function (x) { return x.id !== id; }); g.members.push(m); toast(tr('backToast', { n: dn(m) })); }
  else if (a === 'undoclaim') { m = find(id); var shown = m.display, plain = m.name; delete m.display; delete m.acct; m.name = plain; g.members.push({ id: 'n' + (uid++), name: shown, acct: 1 }); st.sheet = null; toast(tr('claimUndone', { n: shown, c: plain })); }
  else if (a === 'thatsme') { m = find(id); var self = me(); var myName = st.vname; g.members = g.members.filter(function (x) { return x !== self; }); m.display = myName; m.acct = 1; toast(tr('meToast', { n: dn({ name: m.name }) })); }
  else if (a === 'hasexp') { st.hasExpenses = !st.hasExpenses; }
  else if (a === 'leave') { st.left = true; go('groups'); toast(tr('leftToast', { g: gname() }), null, true, true); }
  else if (a === 'gemoji') { g.emoji = el.dataset.v; }
  else if (a === 'gcur') { g.cur = el.dataset.v; }
  else if (a === 'savesettings') { var sn = val('sname'); if (!sn || sn.length > 60) { st.err = tr('nameBad'); } else { g.name = sn; st.err = null; toast(tr('saved'), null, true); } }
  else if (a === 'deletegroup') { g.deleted = true; go('groups'); toast(tr('deletedToast'), 'delete', true, true); }
  else if (a === 'restoregroup') { g.deleted = false; st.left = false; toast(tr('restored')); }
  else if (a === 'undo') { undo(el.dataset.u); }
  else if (a === 'join') { st.join = 'claim'; }
  else if (a === 'claimjoin') { go('group'); st.vname = 'Ana'; toast(tr('joinedToast', { g: gname() }), null, true); }
  else if (a === 'signup') {
    if (!val('su-name')) { st.err = tr('nameErr'); } else { st.err = null; st.join = 'new'; go('join'); }
  }
  render();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'newname') { e.preventDefault(); doAddName(); render(); } });
st = freshState();
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('lang')) { st.lang = q.get('lang'); }
  if (q.get('dark')) { st.dark = q.get('dark') === '1'; }
  if (q.get('nav')) { st.nav = q.get('nav'); }
  if (q.get('who')) { st.vname = q.get('who'); }
  if (q.get('join')) { st.join = q.get('join'); }
  if (q.get('sheet')) { st.sheet = q.get('sheet'); }
  if (q.get('addsheet')) { st.addSheet = true; }
  if (q.get('fin')) { st.finOpen = true; }
  if (q.get('toast')) { toast(tr('resetDone'), 'reset', true, true); }
  if (q.get('fresh')) { st.g.members = [st.g.members[0]]; st.g.removed = []; }
  if (q.get('deleted')) { st.g.deleted = true; }
  if (q.get('err')) { st.err = tr('nameBad'); }
  if (q.get('screen')) { st.screen = q.get('screen'); }
})();
render();
</script>
