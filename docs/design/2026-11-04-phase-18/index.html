<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 18 mockup: Statistics (layout A, Filip's pick)</title>
<style>
  :root {
    --bg: #ffd9a8; --fg: #3d2610; --card: #fff1dc; --line: #9c6f47; --primary: #b54a00; --primary-fg: #fff;
    --muted: #7a3300; --pill: #fff; --bar: #b54a00; --bar-old: #d9a46c; --pos: #1d6b2e; --neg: #b71f1f;
  }
  [data-theme='dark'] {
    --bg: #1f1816; --fg: #fff1dc; --card: #2c2220; --line: #8d7d77; --primary: #ffa53a; --primary-fg: #3d2610;
    --muted: #ffd9a8; --pill: #423531; --bar: #ffa53a; --bar-old: #72625c; --pos: #7fd08c; --neg: #ff8a80;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px system-ui, sans-serif; }
  .frame { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  .note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--pill); }
  .chip[aria-pressed='true'] { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  .label { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .totals { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 12px 0; font-size: 14px; }
  .totals b { font-size: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .title { font-size: 15px; }
  .big { font-size: 32px; font-weight: 700; line-height: 1.1; }
  .vs { font-size: 13px; }
  .vs.up { color: var(--pos); } .vs.down { color: var(--neg); } .vs.same { color: var(--muted); }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 56px; margin-top: 10px; }
  .bars i { flex: 1; min-width: 2px; background: var(--bar); border-radius: 2px 2px 0 0; }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .custom { display: none; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .custom.on { display: flex; }
  .custom input { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: #fff; color: #3d2610; font: inherit; }
  .theme { min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--pill); }
  @media (min-width: 64rem) {
    .frame { max-width: 960px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid .card { margin: 0; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="top"><h1>Statistics</h1><button class="theme" id="theme">Light / dark</button></div>
  <p class="note">Mockup: click the range chips, the grouping and the theme button. Numbers are made up. Only counts, never names or amounts. Your own account is left out.</p>

  <div class="chips" id="ranges">
    <button class="chip" data-r="7">7 days</button>
    <button class="chip" data-r="30">30 days</button>
    <button class="chip" data-r="month" aria-pressed="true">This month</button>
    <button class="chip" data-r="365">12 months</button>
    <button class="chip" data-r="all">All</button>
    <button class="chip" data-r="custom">Custom</button>
  </div>
  <div class="custom" id="custom"><input type="date" value="2026-10-01"> to <input type="date" value="2026-11-04"></div>
  <div class="label">Group by</div>
  <div class="chips" id="by">
    <button class="chip" data-b="day" aria-pressed="true">Day</button>
    <button class="chip" data-b="week">Week</button>
    <button class="chip" data-b="month">Month</button>
    <button class="chip" data-b="year">Year</button>
  </div>

  <div class="totals">Since the start: <b>58</b> accounts · <b>14</b> groups · <b>412</b> expenses · <b>96</b> payments</div>

  <div class="grid" id="cards"></div>
</div>
<script>
  const root = document.documentElement;
  document.getElementById('theme').onclick = () => root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';

  const metrics = [
    { t: 'New sign-ups', n: 9, prev: 6, sub: 'Email 4 · Google 3 · Guest 2 · guests who made an account 1', seed: 3 },
    { t: 'Active people', n: 21, prev: 21, sub: 'of them guests 4', extra: '59 person-days', seed: 7 },
    { t: 'Joined via invite', n: 5, prev: 8, sub: '', seed: 11 },
    { t: 'Groups created', n: 3, prev: 0, sub: '', seed: 5 },
    { t: 'Expenses added', n: 78, prev: 61, sub: '', seed: 13 },
    { t: 'Payments confirmed', n: 12, prev: 12, sub: '', seed: 2 },
  ];
  let range = 'month', by = 'day';
  const counts = { day: 30, week: 12, month: 12, year: 3 };
  function pseudo(seed, i) { const x = Math.sin(seed * 97 + i * 13.7) * 10000; return x - Math.floor(x); }
  function vs(m) {
    if (range === 'all') return '';
    if (m.prev === 0) return '<span class="vs up">new, none before</span>';
    const d = Math.round((m.n - m.prev) / m.prev * 100);
    const label = range === 'month' ? 'last month' : range === 'custom' ? 'the period before' : 'the ' + range + (range === '365' ? ' days' : ' days') + ' before';
    if (d === 0) return '<span class="vs same">same as ' + label + '</span>';
    return '<span class="vs ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '') + d + '% vs ' + label + '</span>';
  }
  function render() {
    const nBars = range === 'all' ? Math.max(counts[by], 6) : counts[by];
    document.getElementById('cards').innerHTML = metrics.map(m => {
      const bars = Array.from({ length: nBars }, (_, i) => '<i style="height:' + (8 + Math.round(pseudo(m.seed, i) * 92)) + '%"></i>').join('');
      const extra = m.extra && by !== 'day' ? '<div class="sub">' + m.extra + '</div>' : '';
      return '<div class="card"><div class="row"><span class="title">' + m.t + '</span>' + vs(m) + '</div>' +
        '<div class="big">' + m.n + '</div>' + (m.sub ? '<div class="sub">' + m.sub + '</div>' : '') + extra +
        '<div class="bars" aria-hidden="true">' + bars + '</div><div class="axis"><span>start</span><span>end</span></div></div>';
    }).join('');
  }
  function wire(id, attr, set) {
    document.getElementById(id).onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      document.querySelectorAll('#' + id + ' button').forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true'); set(b.dataset[attr]); render();
    };
  }
  wire('ranges', 'r', v => { range = v; document.getElementById('custom').classList.toggle('on', v === 'custom'); });
  wire('by', 'b', v => by = v);
  render();
</script>
</body>
</html>
