name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kvit.slnx

      - name: Build
        run: dotnet build Kvit.slnx --no-restore --configuration Release

      - name: Build the certificate script
        run: dotnet build scripts/NewDataProtectionCertificate.cs --configuration Release

      - name: Test
        run: dotnet test Kvit.slnx --no-build --configuration Release

      - name: Docker build
        run: docker build -f src/api/Dockerfile .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
