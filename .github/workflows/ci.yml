name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kvit.slnx

      - name: Build
        run: dotnet build Kvit.slnx --no-restore --configuration Release

      - name: Build the certificate script
        run: dotnet build scripts/NewDataProtectionCertificate.cs --configuration Release

      - name: Build the password reset script
        run: dotnet build scripts/ResetPassword.cs --configuration Release

      - name: Test
        run: dotnet test Kvit.slnx --no-build --configuration Release

      - name: Docker build
        run: docker build -f src/api/Dockerfile .

      - name: Restore the .NET tools
        run: dotnet tool restore

      - name: Check that every model change has a migration
        env:
          ConnectionStrings__KvitDatabase: Host=localhost;Database=ci-design-time
        run: dotnet ef migrations has-pending-model-changes --project src/api/Kvit.Infrastructure --startup-project src/api/Kvit.Api --configuration Release --no-build

      - name: Check the Neon secret is set
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEON_DIRECT_CONNECTION_STRING: ${{ secrets.NEON_DIRECT_CONNECTION_STRING }}
        run: |
          if [ -z "$NEON_DIRECT_CONNECTION_STRING" ]; then
            echo "::error::The repository secret NEON_DIRECT_CONNECTION_STRING is missing or empty, so the migrations cannot be applied to Neon. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build the migration bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__KvitDatabase: Host=localhost;Database=ci-design-time
        run: dotnet ef migrations bundle --project src/api/Kvit.Infrastructure --startup-project src/api/Kvit.Api --configuration Release --no-build --output "$RUNNER_TEMP/efbundle" --force

      - name: Apply the database migrations to Neon
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__KvitDatabase: ${{ secrets.NEON_DIRECT_CONNECTION_STRING }}
        run: |
          "$RUNNER_TEMP/efbundle"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/web/.nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
