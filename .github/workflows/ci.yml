name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kvit.slnx

      - name: Build
        run: dotnet build Kvit.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Kvit.slnx --no-build --configuration Release
