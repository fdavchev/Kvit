services:
  postgres:
    image: postgres:18
    container_name: kvit-postgres
    environment:
      POSTGRES_USER: kvit
      POSTGRES_DB: kvit
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kvit-postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kvit", "-d", "kvit"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  kvit-postgres-18-data:
